name: Daily visitor IP digest

on:
  schedule:
    # 07:00 IST (01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Email last 24h visits CSV and purge rows older than 90 days
        env:
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL:-https://zaftys.com}"
          SITE_URL="${SITE_URL%/}"
          if [ -z "${MIGRATE_TOKEN}" ]; then
            echo "MIGRATE_TOKEN secret is required"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Digest attempt ${attempt}"
            if curl -fsS -X POST "${SITE_URL}/api/visit-digest.php" \
              -H "X-Zaftys-Migrate-Token: ${MIGRATE_TOKEN}" \
              -H "Content-Type: application/json"; then
              echo
              echo "Digest succeeded"
              exit 0
            fi
            sleep 8
          done
          echo "Digest failed after retries"
          exit 1
