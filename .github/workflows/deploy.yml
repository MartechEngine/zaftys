name: Build and Deploy ZAFTYS to Hostinger via FTP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CLARITY_ID: ${{ secrets.VITE_CLARITY_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Add SPA fallback (.htaccess) if missing
        run: |
          mkdir -p dist
          if [ ! -f "dist/.htaccess" ]; then
            if [ -f "public/.htaccess" ]; then
              cp public/.htaccess dist/.htaccess
            else
              cat << 'EOF' > dist/.htaccess
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF
            fi
          fi

      - name: Generate Hostinger secrets PHP
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_ENCRYPTION: ${{ secrets.SMTP_ENCRYPTION }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          MAIL_CONTACT: ${{ secrets.MAIL_CONTACT }}
          MAIL_SUBSCRIBERS: ${{ secrets.MAIL_SUBSCRIBERS }}
          MAIL_PARTNER: ${{ secrets.MAIL_PARTNER }}
          MAIL_CAREERS: ${{ secrets.MAIL_CAREERS }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
          ZAFTS_SECRETS_OUT: dist/config/zaftys-secrets.php
        run: node scripts/generate-zaftys-secrets.mjs

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          # FTP_PATH secret should be set to "public_html/" for zaftys.com
          server-dir: ${{ secrets.FTP_PATH }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**
            **/*.map
            **/zaftys-secrets.example.php
          dangerous-clean-slate: true

      - name: Run newsletter SQL migration
        env:
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL:-https://zaftys.com}"
          SITE_URL="${SITE_URL%/}"
          if [ -z "${MIGRATE_TOKEN}" ]; then
            echo "MIGRATE_TOKEN secret is required"
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            echo "Migration attempt ${attempt}"
            if curl -fsS -X POST "${SITE_URL}/api/migrate.php" \
              -H "X-Zaftys-Migrate-Token: ${MIGRATE_TOKEN}" \
              -H "Content-Type: application/json"; then
              echo
              echo "Migration succeeded"
              exit 0
            fi
            sleep 8
          done
          echo "Migration failed after retries"
          exit 1
