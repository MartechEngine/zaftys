<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAFTYS Logistics  -  Industrial Freight Across India</title>
    <meta name="description" content="ZAFTYS Logistics moves industrial freight across India with company-operated transport, ZAFTYS TMS visibility, and TranZfort capacity. Get a quote on WhatsApp." />
    <meta name="author" content="ZAFTYS Logistics" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo-header.png" />

    <!-- DPR-aware hero preload. Cap display size so desktop PSI does not pull 1920w. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/lcp/hero-home-1280.webp"
      imagesrcset="/images/lcp/hero-home-640.webp 640w, /images/lcp/hero-home-960.webp 960w, /images/lcp/hero-home-1280.webp 1280w, /images/lcp/hero-home-1920.webp 1920w"
      imagesizes="(max-width: 768px) 100vw, 1280px"
      fetchpriority="high"
    />

    <meta property="og:title" content="ZAFTYS Logistics  -  Industrial Freight Across India" />
    <meta property="og:description" content="Industrial freight across India. Company-operated fleet, ZAFTYS TMS visibility, and verified capacity through TranZfort." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZAFTYS Logistics" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://zaftys.com/" />
    <meta property="og:image" content="https://zaftys.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZAFTYS Logistics  -  Industrial Freight Across India" />
    <meta name="twitter:description" content="Industrial freight across India. Company-operated fleet, ZAFTYS TMS, and TranZfort capacity." />
    <meta name="twitter:image" content="https://zaftys.com/og-image.png" />
    <style>
      html, body { margin: 0; background: #0a1628; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!-- Image-only homepage LCP shell (no headline) so React can replace #root without text CLS. -->
    <script>
      (function () {
        var path = location.pathname;
        if (path !== "/" && path !== "") return;
        var root = document.getElementById("root");
        if (!root || root.childNodes.length) return;
        root.innerHTML =
          '<div id="lcp-shell" style="min-height:70vh;background:#0a1628;position:relative;overflow:hidden">' +
          '<img src="/images/lcp/hero-home-1280.webp" srcset="/images/lcp/hero-home-640.webp 640w, /images/lcp/hero-home-960.webp 960w, /images/lcp/hero-home-1280.webp 1280w, /images/lcp/hero-home-1920.webp 1920w" sizes="(max-width: 768px) 100vw, 1280px" width="1280" height="720" alt="" fetchpriority="high" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />' +
          '<div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(10,22,40,.95),rgba(10,22,40,.45))"></div>' +
          "</div>";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
