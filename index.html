<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAFTYS Logistics  -  Industrial Freight Across India</title>
    <meta name="description" content="ZAFTYS Logistics moves industrial freight across India with company-operated transport, ZAFTYS TMS visibility, and TranZfort capacity. Get a quote on WhatsApp." />
    <meta name="author" content="ZAFTYS Logistics" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo-header-180.png" />

    <!-- DPR-aware hero preload. Cap display size so desktop PSI does not pull 1920w for a 1350px viewport. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/lcp/hero-home-1280.webp"
      imagesrcset="/images/lcp/hero-home-640.webp 640w, /images/lcp/hero-home-960.webp 960w, /images/lcp/hero-home-1280.webp 1280w, /images/lcp/hero-home-1920.webp 1920w"
      imagesizes="(max-width: 768px) 100vw, 1280px"
      fetchpriority="high"
    />

    <meta property="og:title" content="ZAFTYS Logistics  -  Industrial Freight Across India" />
    <meta property="og:description" content="Industrial freight across India. Company-operated fleet, ZAFTYS TMS visibility, and verified capacity through TranZfort." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZAFTYS Logistics" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://zaftys.com/" />
    <meta property="og:image" content="https://zaftys.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZAFTYS Logistics  -  Industrial Freight Across India" />
    <meta name="twitter:description" content="Industrial freight across India. Company-operated fleet, ZAFTYS TMS, and TranZfort capacity." />
    <meta name="twitter:image" content="https://zaftys.com/og-image.png" />

    <style>
      html, body { margin: 0; background: #0a1628; }
      #lcp-shell {
        position: absolute;
        inset: 0 0 auto 0;
        min-height: 520px;
        height: 100vh;
        max-height: 900px;
        overflow: hidden;
        background: #0a1628;
        z-index: 0;
        pointer-events: none;
      }
      #lcp-shell img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #lcp-shell .lcp-grad {
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(10, 22, 40, 0.95), rgba(10, 22, 40, 0.45));
      }
      #lcp-shell .lcp-copy {
        position: relative;
        z-index: 1;
        max-width: 56rem;
        padding: 7rem 1.25rem 3rem;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #lcp-shell h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 700;
        line-height: 1.15;
      }
      @media (min-width: 768px) {
        #lcp-shell .lcp-copy { padding: 8rem 1.5rem 3rem; }
        #lcp-shell h1 { font-size: clamp(2.75rem, 5vw, 4.5rem); }
      }
      #root { position: relative; z-index: 1; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var path = location.pathname;
        if (path !== "/" && path !== "") return;
        var shell = document.createElement("div");
        shell.id = "lcp-shell";
        shell.innerHTML =
          '<img src="/images/lcp/hero-home-960.webp" srcset="/images/lcp/hero-home-640.webp 640w, /images/lcp/hero-home-960.webp 960w, /images/lcp/hero-home-1280.webp 1280w, /images/lcp/hero-home-1920.webp 1920w" sizes="(max-width: 768px) 100vw, 1280px" width="1280" height="720" alt="" fetchpriority="high" decoding="async" />' +
          '<div class="lcp-grad" aria-hidden="true"></div>' +
          '<div class="lcp-copy"><h1>ZAFTYS Logistics  -  Industrial Freight Across India.</h1></div>';
        document.body.insertBefore(shell, document.getElementById("root"));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
